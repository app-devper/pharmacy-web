steps:
  - name: node:20
    entrypoint: bash
    args:
      - -ceu
      - |
        npm ci
        npm install --no-save --cpu=x64 --os=linux --libc=glibc \
          @rolldown/binding-linux-x64-gnu@1.0.0-rc.16 \
          @tailwindcss/oxide-linux-x64-gnu@4.2.3 \
          lightningcss-linux-x64-gnu@1.32.0
  - name: node:20
    entrypoint: npm
    args: [run, build]
    env:
      - VITE_API_URL=https://pharmacy-api-1056670356976.asia-southeast1.run.app
      - VITE_UM_API_URL=https://devper-um-1056670356976.asia-southeast1.run.app
  - name: node:20
    entrypoint: npx
    args:
      - firebase-tools
      - deploy
      - --only
      - hosting:dpharm
      - --project
      - devperpos
      - --non-interactive
options:
  logging: CLOUD_LOGGING_ONLY
